# Klipper TMC Autotune - https://github.com/andrewmcgr/klipper_tmc_autotune
# Requires the plugin installed on the Pi first (Klipper won't start without it):
#   wget -O - https://raw.githubusercontent.com/andrewmcgr/klipper_tmc_autotune/main/install.sh | bash
# Enable/disable everything here with the single [include autotune.cfg] line in printer.cfg.
#
# All motors are stock Anet 42SHDC3025-24B (in the plugin's motor database).
# tuning_goal: silent = StealthChop at all speeds (quiet). Try "performance"
# (tuned spreadCycle) on X/Y if VFAs remain - louder, often cleaner walls:
#   AUTOTUNE_TMC STEPPER=stepper_x TUNING_GOAL=performance

# --- Driver overrides needed by autotune (merged over btt_skr.cfg / ebb42.cfg) ---
# Autotune wants interpolation and controls StealthChop/spreadCycle itself.
[tmc2209 stepper_x]
interpolate: True
stealthchop_threshold: 0

[tmc2209 stepper_y]
interpolate: True
stealthchop_threshold: 0

[tmc2209 stepper_z]
interpolate: True
stealthchop_threshold: 0

[tmc2209 stepper_z1]
interpolate: True
stealthchop_threshold: 0

[tmc2209 extruder]
interpolate: True

# --- Autotune ---
[autotune_tmc stepper_x]
motor: bozu-42SHDC3025-24B
tuning_goal: silent
voltage: 24
# Sensorless homing threshold (replaces driver_SGTHRS, which autotune overrides)
sg4_thrs: 125

[autotune_tmc stepper_y]
motor: bozu-42SHDC3025-24B
tuning_goal: silent
voltage: 24
sg4_thrs: 130

[autotune_tmc stepper_z]
motor: bozu-42SHDC3025-24B
tuning_goal: silent
voltage: 24

[autotune_tmc stepper_z1]
motor: bozu-42SHDC3025-24B
tuning_goal: silent
voltage: 24

[autotune_tmc extruder]
motor: bozu-42SHDC3025-24B
voltage: 24
# auto -> silent for the extruder
