[include index.cfg]
[include btt_skr.cfg]

#input shaper
#[include lis2dw.cfg]
[input_shaper]
#shaper_type_x=mzv
#shaper_freq_x=0
#shaper_type_y=mzv
#shaper_freq_y=0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 750
max_z_velocity: 5
max_z_accel: 100
square_corner_velocity: 5

[gcode_arcs]
resolution: .25

[pause_resume]

[display_status]

[virtual_sdcard]
path: ~/printer_data/gcodes

#[save_variables]
#filename: ~/klipper_config/variables.cfg ; variable storage file

[force_move]
enable_force_move: True

[safe_z_home]
home_xy_position: 110, 110
z_hop: 5
z_hop_speed: 15.0
move_to_previous: False

