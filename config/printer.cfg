[include index.cfg]
[include btt_skr.cfg]
[include ebb42.cfg]
# uncomment below line when you do input shaper
#[include lis2dw.cfg]

[exclude_object]
[skew_correction]

# Enable arcs support
[gcode_arcs]
resolution: 0.1

[save_variables]
filename: ~/printer_data/config/variables.cfg

[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 1500
max_z_velocity: 12
max_z_accel: 200
square_corner_velocity: 5

[pause_resume]

[display_status]

[virtual_sdcard]
path: ~/printer_data/gcodes

#[save_variables]
#filename: ~/klipper_config/variables.cfg ; variable storage file

[force_move]
enable_force_move: True

[safe_z_home]
home_xy_position: 110, 110
z_hop: 5
z_hop_speed: 15.0
move_to_previous: False

