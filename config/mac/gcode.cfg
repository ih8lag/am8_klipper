[gcode_macro _CG28]
description: Helper: Conditional homing
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    {action_respond_info("Homing active!")}
    G28
  {% else %}
    {action_respond_info("All Axes homed!")}
  {% endif %}

######################################
# G34 Z-Tilt                         #
######################################
[gcode_macro G34]
gcode:
    #probe_reset
    Z_TILT_ADJUST

[gcode_macro _CG34]
gcode:
    {% if printer['z_tilt'].applied == false %}
      G34
    {% endif %}

[gcode_macro BED_MESH_TEMP]
description: Waits for bed to reach mesh temp, then meshes (forces fresh mesh each print)
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    M117 Waiting for bed before meshing
    M190 S{BED_TEMP}      ; wait for bed to actually reach temp - mesh needs stable bed for accuracy
    BED_MESH_CALIBRATE

[gcode_macro _MOVE_TO_OOZE]
description: Helper: park away from print area while heating
gcode:
    {% set safe_z = [printer.toolhead.position.z, 30]|max %}
    G90
    G1 Z{safe_z} F1200
    G1 X10 Y10 F7200

[gcode_macro _CLEAN_NOZZLE]
description: Helper: purge + air-wipe ooze off before priming (no physical brush)
gcode:
    G90
    G1 Z2 F1200                        ; close to bed, not touching
    G1 X10 Y10 F6000                   ; scrap corner, off the mesh area
    M83                                ; relative extrusion for this purge
    G1 E3 F150                         ; slow purge - clears old ooze/degraded plastic
    G4 P500                            ; let a droplet form
    G1 X30 Y10 F9000                   ; fast shake move flings the droplet off
    G1 X10 Y10 F9000
    G1 E-0.3 F1800                     ; small retract before PRIME_LINE
    M82                                ; back to absolute extrusion