[gcode_macro _CG28]
description: Helper: Conditional homing
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    {action_respond_info("Homing active!")}
    G28
  {% else %}
    {action_respond_info("All Axes homed!")}
  {% endif %}

######################################
# G34 Z-Tilt                         #
######################################
[gcode_macro G34]
gcode:
    #probe_reset
    Z_TILT_ADJUST

[gcode_macro _CG34]
gcode:
    {% if printer['z_tilt'].applied == false %}
      G34
    {% endif %}

[gcode_macro BED_MESH_TEMP]
description: Waits for bed to reach mesh temp, then meshes (forces fresh mesh each print)
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    M117 Waiting for bed before meshing
    M190 S{BED_TEMP}      ; wait for bed to actually reach temp - mesh needs stable bed for accuracy
    BED_MESH_CALIBRATE

[gcode_macro _MOVE_TO_OOZE]
description: Helper: park away from print area while heating
gcode:
    {% set safe_z = [printer.toolhead.position.z, 30]|max %}
    G90
    G1 Z{safe_z} F1200
    G1 X10 Y10 F7200

[gcode_macro _CLEAN_NOZZLE]
description: Helper: purge + air-wipe ooze off before priming (no physical brush)
gcode:
    G90
    G1 Z2 F1200                        ; close to bed, not touching
    G1 X10 Y10 F6000                   ; scrap corner, off the mesh area
    M83                                ; relative extrusion for this purge
    G1 E3 F150                         ; slow purge - clears old ooze/degraded plastic
    G4 P500                            ; let a droplet form
    G1 X30 Y10 F9000                   ; fast shake move flings the droplet off
    G1 X10 Y10 F9000
    G1 E-0.3 F1800                     ; small retract before PRIME_LINE
    M82                                ; back to absolute extrusion

[gcode_macro SAVE_Z_OFFSET_AS]
description: Save the tuned Z offset for a filament. Use after PROBE_CALIBRATE+ACCEPT and/or baby-stepping. e.g. SAVE_Z_OFFSET_AS NAME=PETG
gcode:
    {% set raw = params.NAME|default("")|string|lower %}
    {% if raw == "" %}
        {action_raise_error("SAVE_Z_OFFSET_AS needs NAME=, e.g. NAME=PLA")}
    {% endif %}
    {% set name = raw if raw.startswith("z_offset_") else "z_offset_" ~ raw %}

    # Probe offset: a pending PROBE_CALIBRATE/ACCEPT value wins over the loaded config value
    {% set pending = printer.configfile.save_config_pending_items %}
    {% set probe_cfg = printer.configfile.settings.probe.z_offset|float %}
    {% if "probe" in pending and "z_offset" in pending.probe %}
        {% set probe_z = pending.probe.z_offset|float %}
        {% set from_cal = True %}
    {% else %}
        {% set probe_z = probe_cfg %}
        {% set from_cal = False %}
    {% endif %}

    # Plus any baby-stepping (negative gcode offset = nozzle closer).
    # A fresh PROBE_CALIBRATE is a complete measurement on its own, so ignore any gcode
    # offset then - it is usually just left over from the previous START_PRINT.
    {% set baby = 0.0 if from_cal else printer.gcode_move.homing_origin.z|float %}
    {% set z = probe_z - baby %}

    {% if z <= 0 or z > 3.0 %}
        {action_respond_info("Computed Z offset %.3f (probe %.3f, babystep %.3f) is outside 0-3.0mm - nothing saved" % (z, probe_z, baby))}
    {% else %}
        SAVE_VARIABLE VARIABLE={name} VALUE={"%.3f" % z}
        {action_respond_info("Saved %s = %.3f (probe %.3f + babystep %.3f)" % (name, z, probe_z, 0 - baby))}
        {% if from_cal %}
            {action_respond_info("IMPORTANT: run RESTART now - do NOT SAVE_CONFIG. The calibrate result is pending and would overwrite probe z_offset (must stay 0).")}
        {% endif %}
        {% if probe_cfg != 0 %}
            {action_respond_info("WARNING: loaded probe z_offset is %.3f, not 0 - set it back to 0 in printer.cfg or START_PRINT offsets will be doubled" % probe_cfg)}
        {% endif %}
    {% endif %}
