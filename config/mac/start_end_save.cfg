# CURA STARTUP = `START_PRINT T_BED={material_bed_temperature} T_EXTRUDER={material_print_temperature}`

[gcode_macro START_PRINT]
gcode:
    {% set T_BED = params.T_BED|default(60) %}
    {% set T_EXTRUDER = params.T_EXTRUDER|default(205) %}
    {% set FILAMENT = params.FILAMENT_TYPE|default("PLA")|string|upper %}
    {% set no_ooze_temp = [T_EXTRUDER|int, 180]|min %}

    G21 ; set units to millimeters
    G92 E0 ; Reset Extruder
    G90 ;Absolute positioning

    # Start bed heating and continue, can be warming while the other prep is done
    M140 S{T_BED}
    M104 S{no_ooze_temp} ; set extruder0 no-ooze temp
    M105 ; report temperature

    # Homing
    _CG28 ; Conditional homing

    ;<multiple z screws>
    Z_TILT_ADJUST
    G28 Z
    ;</multiple z screws>
    G0 Z10; Raise nozzle before warmup
    _PARK_EXTRUDER EXTRUDER=extruder

;------------------------------------
    BED_MESH_TEMP BED_TEMP={T_BED}  ; bed mesh leveling - force as we need to ensure dual Z screws are still valid
;------------------------------------

    # Per-material Z offset correction
    # Config always holds whichever material was calibrated most recently -
    # apply the difference between that and the material actually printing now.
    {% set z_config = printer.configfile.settings.probe.z_offset|float %}
    {% if FILAMENT == "ABS" %}
        {% set z_target = printer.save_variables.variables.z_offset_abs|default(z_config)|float %}
    {% elif FILAMENT == "PETG" %}
        {% set z_target = printer.save_variables.variables.z_offset_petg|default(z_config)|float %}
    {% else %}
        {% set z_target = printer.save_variables.variables.z_offset_pla|default(z_config)|float %}
    {% endif %}
    {% set z_delta = z_target - z_config %}
    {% if (z_delta|abs) > 0.5 %}
        {action_respond_info("WARNING: computed Z offset delta %.3f exceeds safety limit - skipping auto-adjust, check saved variables" % z_delta)}
    {% else %}
        SET_GCODE_OFFSET Z={z_delta} MOVE=1
        {action_respond_info("Applied Z offset delta %.3f for %s" % (z_delta, FILAMENT))}
    {% endif %}

    M140 S{T_BED} ; heated bed control AND continue

    _MOVE_TO_OOZE

    M117 Waiting for temperature
    M109 S{T_EXTRUDER} ; Heated extruder control and wait
    M190 S{T_BED} ; heated bed control and wait

    _CLEAN_NOZZLE

    PRIME_LINE
    M117 Printing...

#==============================================
# IDLE_TIMEOUT
#==============================================
[gcode_macro IDLE_TIMEOUT]
gcode:
    M107                                ; tunr off fan
    M84                                 ; turn off steppers
	TURN_OFF_HEATERS					; turn off heaters

    M117 time out                       ; display message

    SAVE_IF_SET                         ; save config

[gcode_macro END_PRINT]
gcode:
	M400								; wait for buffer to clear
	M117 Done printing					; display message

    PRINT_CANCEL
	TURN_OFF_HEATERS					; turn off heaters

	M117 Ready                          ; display message

    SAVE_IF_SET                         ; save config

#==============================================
# SAVE_AT_END
#==============================================
[gcode_macro SAVE_AT_END]
variable_save: 0
gcode:
    SET_GCODE_VARIABLE MACRO=SAVE_AT_END VARIABLE=save VALUE=1

#==============================================
# SAVE_IF_SET
#==============================================
[gcode_macro SAVE_IF_SET]
gcode:
    {% if printer["gcode_macro SAVE_AT_END"].save == 1 %}
        {action_respond_info("Saving was requested - saving and restarting now")}
        SAVE_CONFIG
	{% else %}
        {action_respond_info("Saving was NOT requested")}
    {% endif %}

#==============================================
# SAVE_CONFIG alias
#==============================================
[gcode_macro M500]
gcode:
    SAVE_CONFIG