[gcode_macro START_PRINT]
gcode:
    {% set T_BED = params.T_BED|default(60) %}
    {% set T_EXTRUDER = params.T_EXTRUDER|default(205) %}
    {% set FILAMENT = params.FILAMENT_TYPE|default("PLA")|string|upper %}
    {% set no_ooze_temp = [T_EXTRUDER|int, 180]|min %}

    G21 								; set units to millimeters
    G92 E0 								; Reset Extruder
    G90 								; Absolute positioning

    # Start bed heating and continue, can be warming while the other prep is done
    M140 S{T_BED}
    M104 S{no_ooze_temp} 				; set extruder0 no-ooze temp
    M105 								; report temperature

	# Bed soak
	M190 S{T_BED}        				; block here — wait until bed is ACTUALLY at temp
    G4 P300000            				; NOW soak — frame/gantry stabilize at true temp

    # Homing
    _CG28 ; Conditional homing

    # align z screws
    Z_TILT_ADJUST
    G28 Z							
    G0 Z10; Raise nozzle before warmup
    _PARK_EXTRUDER EXTRUDER=extruder

	;------------------------------------
    BED_MESH_TEMP BED_TEMP={T_BED}  ; bed mesh leveling - force as we need to ensure dual Z screws are still valid
	;------------------------------------

    # Per-material Z offset
    # Probe z_offset is 0, so un-offset Z0 is the probe trigger point - always well above the bed.
    # Each filament stores how far below that point it prints (positive number, mm).
    # Applied as a negative gcode offset, so every filament moves the nozzle CLOSER from a safe 0.
    {% set fil_key = "z_offset_" ~ FILAMENT|lower %}
    {% set vars = printer.save_variables.variables %}
    {% if fil_key in vars %}
        {% set z_fil = vars[fil_key]|float %}
    {% else %}
        {% set z_fil = 0.0 %}
        {action_respond_info("No %s saved - Z offset left at 0 (nozzle will be high). Tune it, then SAVE_Z_OFFSET_AS NAME=%s" % (fil_key, fil_key))}
    {% endif %}
    {% if z_fil < 0 or z_fil > 3.0 %}
        SET_GCODE_OFFSET Z=0
        {action_respond_info("WARNING: Z offset %.3f for %s is outside 0-3.0mm - leaving offset at 0, check variables.cfg" % (z_fil, FILAMENT))}
    {% else %}
        SET_GCODE_OFFSET Z={z_fil * -1}
        {action_respond_info("Applied Z offset %.3f for %s" % (-z_fil, FILAMENT))}
    {% endif %}

    M140 S{T_BED} 						; heated bed control AND continue

    _MOVE_TO_OOZE

	SKEW_PROFILE LOAD=my_skew_profile	; load skew

    M117 Waiting for temperature
    M109 S{T_EXTRUDER} 					; Heated extruder control and wait
    M190 S{T_BED} 						; heated bed control and wait

    _CLEAN_NOZZLE

    PRIME_LINE
    M117 Printing...

#==============================================
# IDLE_TIMEOUT
#==============================================
[gcode_macro IDLE_TIMEOUT]
gcode:
    M107                                ; tunr off fan
    M84                                 ; turn off steppers
	TURN_OFF_HEATERS					; turn off heaters

    M117 time out                       ; display message

    SAVE_IF_SET                         ; save config

[gcode_macro END_PRINT]
gcode:
	M400								; wait for buffer to clear
	M117 Done printing					; display message

    PRINT_CANCEL
	TURN_OFF_HEATERS					; turn off heaters

	M117 Ready                          ; display message

	SET_SKEW CLEAR=1					; clear skew

    SAVE_IF_SET                         ; save config

#==============================================
# SAVE_AT_END
#==============================================
[gcode_macro SAVE_AT_END]
variable_save: 0
gcode:
    SET_GCODE_VARIABLE MACRO=SAVE_AT_END VARIABLE=save VALUE=1

#==============================================
# SAVE_IF_SET
#==============================================
[gcode_macro SAVE_IF_SET]
gcode:
    {% if printer["gcode_macro SAVE_AT_END"].save == 1 %}
        {action_respond_info("Saving was requested - saving and restarting now")}
        SAVE_CONFIG
	{% else %}
        {action_respond_info("Saving was NOT requested")}
    {% endif %}

#==============================================
# SAVE_CONFIG alias
#==============================================
[gcode_macro M500]
gcode:
    SAVE_CONFIG