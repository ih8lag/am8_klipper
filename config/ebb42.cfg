# BIGTREETECH EBB42 CAN V1.2 toolhead board (STM32G0B1)
# Pinout: https://github.com/bigtreetech/EBB  (EBB42 CAN V1.1&V1.2-PIN.png)
#
# Wiring on the EBB42:
#   E-Motor .......... extruder stepper
#   HE0 .............. Revo-style 24V heater core       (V1.2: PB13)
#   TH0 .............. heater core thermistor            (PA3)
#   FAN1 ............. part cooling fan                  (PA0)
#   FAN2 ............. hotend / heatsink fan             (PA1)
#   Endstop header ... PINDA probe: signal PB7, +5V, GND
#   I2C header ....... filament runout (MK3S IR sensor): signal PB3, +5V, GND

[mcu EBBCan]
canbus_uuid: 8da4307fd08b

[extruder]
step_pin: EBBCan:PD0
dir_pin: EBBCan:PD1         # flipped: "!" ran backwards on this machine
enable_pin: !EBBCan:PD2
microsteps: 16
rotation_distance: 22.357
full_steps_per_rotation: 200
gear_ratio: 1:1
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan:PB13
# Third-party Revo-compatible HeaterCore, measured ~15.4 ohm (~37W at 24V), NTC100K B3950 thermistor
sensor_type: Generic 3950
sensor_pin: EBBCan:PA3
min_temp: 0
max_temp: 300   # heater/thermistor rated for 300C continuous
max_extrude_only_distance: 150
min_extrude_temp: 190
pressure_advance = 0.044
#pressure_advance_smooth_time: 0.040
max_extrude_only_velocity: 50
max_extrude_only_accel: 5000

[tmc2209 extruder]
uart_pin: EBBCan:PA15
#stealthchop_threshold: 999999   # leave extruder in spreadCycle for pressure advance
interpolate: False
run_current: 0.650
hold_current: 0.650

[fan]
pin: EBBCan:PA0
shutdown_speed: 1.0

[heater_fan heater_fan1] # hotend fan
pin: EBBCan:PA1
heater: extruder
heater_temp: 50.0
kick_start_time: 1.000 # 5010 takes a while to spinup

[probe]
# PINDA on the EBB42 Endstop header. Check with QUERY_PROBE:
#   no metal under it -> "open", steel sheet under it -> "TRIGGERED".
#   Reversed -> add "!" (pin: !EBBCan:PB7). Never changes -> add pull-up (pin: ^EBBCan:PB7).
pin: EBBCan:PB7
speed: 30
lift_speed: 50
samples: 2
#z_offset: 0
x_offset: 25
y_offset: 5

[filament_switch_sensor runout]
# Prusa MK3S IR filament sensor on the EBB42 I2C header (PB3), inverted logic.
# Check with QUERY_FILAMENT_SENSOR SENSOR=runout - "detected" with filament loaded.
switch_pin: !EBBCan:PB3
pause_on_runout: True

