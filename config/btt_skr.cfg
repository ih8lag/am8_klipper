[mcu]
serial:  /dev/serial/by-id/usb-Klipper_stm32f429xx_2F0023001750305031353020-if00
restart_method: command
# setup for PA9, PA10 USART1_tx / rx
# These are the pins 8 & 10 the SKR uses for its built in RPI 40 pin connector
# only connect GND(6), TX(8), RX(10) - supply 5v power to the RPI separately
# Use "sudo raspi-config" to disable the serial terminal - but enable the serial port.
# When running "make menuconfig" you must un-select the USB Serial check box
# serial: /dev/serial0 ; RPI GPIO serial
# baud: 250000

[tmc2209 stepper_x]
uart_pin: PE0
#hold_current: 0.900
stealthchop_threshold: 999999
diag_pin: x_diag_pin
driver_SGTHRS: 125
interpolate: False
run_current: 0.850
hold_current: 0.850

[tmc2209 stepper_y]
uart_pin: PD3
#hold_current: 0.900
stealthchop_threshold: 999999
diag_pin: y_diag_pin
driver_SGTHRS: 130
interpolate: False
run_current: 0.850
hold_current: 0.850

[tmc2209 stepper_z]
uart_pin: PD0
run_current: 0.850
hold_current: 0.850
stealthchop_threshold: 999999
diag_pin: z0_diag_pin
driver_SGTHRS: 255
interpolate: False

[tmc2209 stepper_z1]
uart_pin: PD12
run_current: 0.850
hold_current: 0.850
stealthchop_threshold: 999999
diag_pin: z1_diag_pin
driver_SGTHRS: 255
interpolate: False

[tmc2209 extruder]
uart_pin: PC6
run_current: 1.000
#diag_pin: ^PC2
#stealthchop_threshold: 999999
driver_SGTHRS: 255
interpolate: False
run_current: 0.850
hold_current: 0.850

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PC5, EXP1_3=PB1, EXP1_5=PE10, EXP1_7=PE12, EXP1_9=<GND>,
    EXP1_2=PB0, EXP1_4=PE9, EXP1_6=PE11, EXP1_8=PE13, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=PA6, EXP2_3=PE7, EXP2_5=PB2, EXP2_7=PC4,   EXP2_9=<GND>,
    EXP2_2=PA5, EXP2_4=PA4, EXP2_6=PA7, EXP2_8=<RST>, EXP2_10=<NC>,
    # steppers
    x_step_pin=PE2, x_dir_pin=PE1, x_enable_pin=PE3, x_uart_pin=PE0, x_diag_pin=PC1, x_endstop_pin=null,
    y_step_pin=PD5, y_dir_pin=PD4, y_enable_pin=PD6, y_uart_pin=PD3, y_diag_pin=PC3, y_endstop_pin=null,
    z0_step_pin=PA15, z0_dir_pin=PA8, z0_enable_pin=PD1, z0_uart_pin=PD0, z0_diag_pin=PC0, z0_endstop_pin=null,
    z1_step_pin=PD11, z1_dir_pin=PD10, z1_enable_pin=PD13, z1_uart_pin=PD12, z1_diag_pin=PA0,
    e0_step_pin=PD15, e0_dir_pin=PD14, e0_enable_pin=PC7, e0_uart_pin=PC6, e0_diag_pin=null,
    e0_heater_pin=PB3, e0_sensor_pin=PA2,

    # auto leveling
    bltouch_sensor_pin=PE4,   bltouch_control_pin=PE5,
    probe_pin=PE4,

    # fans
    fan_part_cooling_pin=PB7,
    fan_controller_board_pin=PB6,
    fan_toolhead_cooling_pin=null, #wired to permanent

    # Bed heater
    heater_bed_heating_pin=PD7,
    heater_bed_sensor_pin=PA1

[stepper_x]
step_pin: PE2
dir_pin: !PE1 # this is inverted with the "!" for SKR versus from the stock board
enable_pin: !PE3
microsteps: 16
rotation_distance: 32
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: -39
position_min: -39
position_max: 220
homing_speed: 50
homing_retract_dist: 0

[stepper_y]
step_pin: PD5
dir_pin: PD4
enable_pin: !PD6
microsteps: 16
rotation_distance: 32
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: -12
position_min: -12
position_max: 220
homing_speed: 50
homing_retract_dist: 0

[stepper_z]
step_pin: PA15
dir_pin: !PA8
enable_pin: !PD1
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
#position_endstop: 0
position_max: 240
position_min: -5.0
homing_speed: 50

[stepper_z1]
step_pin: PD11
dir_pin: !PD10
enable_pin: !PD13
microsteps: 16
rotation_distance: 8

[extruder]
step_pin: PD15
dir_pin: PD14
enable_pin: !PC7
microsteps: 16
rotation_distance: 21.29247
full_steps_per_rotation: 200
gear_ratio: 1:1
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB3
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA2
# control = pid
# pid_kp = 25.819
# pid_ki = 1.565
# pid_kd = 106.505
min_temp: 0
max_temp: 350
max_extrude_only_distance: 150
min_extrude_temp: 190
pressure_advance = 0.044
#pressure_advance_smooth_time: 0.040

[probe]
pin: PC0
speed: 30
lift_speed: 50
samples: 2
#z_offset: 0
x_offset: 25
y_offset: 5

[heater_bed]
heater_pin: PD7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA1
min_temp: 0
max_temp: 100
# control = pid
# pid_kp = 70.260
# pid_ki = 1.298
# pid_kd = 951.148

[fan]
pin: PB7
shutdown_speed: 1.0

[heater_fan heater_fan1] # hotend fan
pin: PB6
#   Time (in seconds) to run the fan at full speed when either first
#   enabling or increasing it by more than 50% (helps get the fan
#   spinning). The default is 0.100 seconds.
kick_start_time: 1.000 # 5010 takes a while to spinup

[controller_fan controller_fan1] # parts fan
pin: PB5
kick_start_time: 0.5

[output_pin motor_power]
pin: PC13
value: 1